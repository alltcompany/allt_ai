<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>수학 문제 → HWPX 변환기</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <main class="container">
      <h1>수학 문제 스크린샷 → HWPX 변환기</h1>
      <p>이미지를 올리면 텍스트/수식을 인식해서 다운로드 가능한 <code>.hwpx</code> 파일로 변환합니다.</p>

      <form id="uploadForm" action="/convert" method="post" enctype="multipart/form-data">
        <input type="file" name="image" accept="image/*" required />
        <button type="submit">변환 후 다운로드</button>
      </form>

      <section>
        <h2>동작 방식</h2>
        <ul>
          <li>OCR로 일반 텍스트를 추출</li>
          <li>수식 형태로 추정되는 줄은 수식 블록으로 저장</li>
          <li>HWPX 패키지(zip)로 생성해 즉시 다운로드</li>
        </ul>
      </section>
    </main>
  </body>
</html>
